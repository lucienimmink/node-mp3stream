openapi: 3.1.0
info:
  title: Node MP3-Stream API
  version: 5.11.0
  description: |
    HTTP API for authentication, music streaming, library scans, and cached
    artwork. The default local server is shown below; use the configured port
    and HTTPS scheme when SSL is enabled.
servers:
  - url: http://localhost:16882
    description: Default local server without SSL
  - url: https://localhost:16882
    description: Local server when SSL is enabled
tags:
  - name: Authentication
  - name: Music
  - name: Library
  - name: Artwork
  - name: System

paths:
  /authenticate:
    post:
      tags: [Authentication]
      operationId: authenticate
      summary: Exchange encrypted credentials for a JWT
      description: |
        Encrypt a JSON object containing `name` and `password` with the RSA
        public key from `/public-key` using RSA-OAEP with SHA-512. Base64-encode
        the resulting ciphertext and send it as `encryptedPayload`. Tokens
        expire after 24 hours. The JSON request body is limited to 100 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encryptedPayload]
              properties:
                encryptedPayload:
                  type: string
                  contentEncoding: base64
                  description: Base64-encoded RSA-OAEP/SHA-512 ciphertext.
      responses:
        "200":
          description: Credentials accepted.
          content:
            application/json:
              schema:
                type: object
                required: [jwt]
                properties:
                  jwt:
                    type: string
                    description: Signed token valid for 24 hours.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /login:
    post:
      tags: [Authentication]
      operationId: checkLogin
      summary: Check whether a JWT is still valid
      security:
        - CredentialHeader: []
      responses:
        "200":
          description: "Validation result. An invalid token returns `success: false`."
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"

  /public-key:
    get:
      tags: [Authentication]
      operationId: getPublicKey
      summary: Get the RSA public key used for credential encryption
      responses:
        "200":
          description: Public JSON Web Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsaPublicKey"

  /listen:
    get:
      tags: [Music]
      operationId: streamTrack
      summary: Stream a music file
      description: |
        `path` is relative to the configured music directory. Leading slashes
        are accepted; paths escaping the directory, including symlinks that
        resolve outside it, are rejected. Supports a single HTTP byte range.
      security:
        - QueryJwt: []
      parameters:
        - name: path
          in: query
          required: true
          description: Path to the audio file relative to the configured music directory.
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: Optional single byte range, for example `bytes=0-1023` or `bytes=-1024`.
          schema:
            type: string
      responses:
        "200":
          description: Full audio stream.
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Partial audio stream.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Range:
              schema:
                type: string
                example: bytes 0-1023/50000
            Content-Length:
              schema:
                type: integer
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Requested byte range is invalid or unsatisfiable.
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes */50000
        "500":
          $ref: "#/components/responses/InternalServerError"

  /rescan:
    get:
      tags: [Library]
      operationId: startLibraryScan
      summary: Start a library scan
      description: Starts a scan asynchronously; use `/progress` to check its status.
      security:
        - QueryJwt: []
      responses:
        "204":
          description: Scan request accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /progress:
    get:
      tags: [Library]
      operationId: getScanProgress
      summary: Get the current library scan status
      security:
        - QueryJwt: []
      responses:
        "200":
          description: Current scan status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
              examples:
                scanning:
                  value:
                    progress: "45"
                    status: scanning
                ready:
                  value:
                    status: ready
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stream:
    get:
      tags: [Library]
      operationId: subscribeToScanEvents
      summary: Subscribe to server-sent events
      description: |
        Opens an unauthenticated Server-Sent Events connection. The server
        sends an initial ready event; scan progress updates are sent as
        `message` events when available.
      responses:
        "200":
          description: Server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                data: {"progress":0,"status":"ready"}

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Get the application version
      responses:
        "200":
          description: Application version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    example: 5.11.0

  /image:
    get:
      tags: [Artwork]
      operationId: findCachedImage
      summary: Find an image in the artwork cache
      description: Provide `mbid` or `url`. If both are present, `mbid` takes precedence.
      parameters:
        - name: mbid
          in: query
          required: false
          description: Identifier to match against cached filenames.
          schema:
            type: string
        - name: url
          in: query
          required: false
          description: Original image URL; slashes are mapped to underscores for lookup.
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: URL of the cached image.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri-reference
                    example: //localhost:16882/data/cache/cover.jpg
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Artwork]
      operationId: uploadCachedImage
      summary: Upload an image to the artwork cache
      description: |
        Upload exactly one image file. The filename must contain only ASCII
        letters, digits, dots, underscores, or hyphens. Supported formats are
        JPEG, PNG, GIF, and WebP; the server verifies the content signature.
        Maximum file size is 5 MiB.
      security:
        - BearerJwt: []
        - QueryJwt: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image added to the cache.
          content:
            application/json:
              schema:
                type: object
                required: [cachename]
                properties:
                  cachename:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /proxy:
    get:
      tags: [Artwork]
      operationId: proxyImage
      summary: Fetch a public image URL or JSON response
      description: |
        Fetches an image or JSON response from a public host over HTTP or HTTPS
        on its default port. Redirects, non-public IP addresses, unsupported
        content types, and responses larger than 5 MiB are rejected.
      security:
        - QueryJwt: []
      parameters:
        - name: remote
          in: query
          required: true
          description: Public HTTP(S) URL returning a supported image or JSON.
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Retrieved image or JSON response.
          content:
            application/json:
              schema: {}
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
            image/bmp:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
            image/x-icon:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          $ref: "#/components/responses/BadGateway"

components:
  securitySchemes:
    QueryJwt:
      type: apiKey
      in: query
      name: jwt
      description: JWT issued by `/authenticate`; expires after 24 hours.
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CredentialHeader:
      type: apiKey
      in: header
      name: X-Cred
      description: JWT issued by `/authenticate`.

  schemas:
    RsaPublicKey:
      type: object
      required: [kty, n, e]
      properties:
        kty:
          type: string
          const: RSA
        n:
          type: string
          description: Base64url-encoded RSA modulus.
        e:
          type: string
          description: Base64url-encoded RSA public exponent.
        alg:
          type: string
          example: RSA-OAEP-512
        ext:
          type: boolean
        key_ops:
          type: array
          items:
            type: string
      additionalProperties: true

    Progress:
      type: object
      required: [status]
      properties:
        progress:
          type: string
          description: Percentage as stored in the scan progress file.
          example: "45"
        status:
          type: string
          enum: [ready, scanning]

  responses:
    BadRequest:
      description: Request parameters or payload are invalid.
    Unauthorized:
      description: Missing or invalid authentication token or credentials.
    Forbidden:
      description: Requested resource is outside the configured music directory.
    NotFound:
      description: Requested resource was not found.
    PayloadTooLarge:
      description: Request body or remote image exceeds the applicable size limit.
    UnsupportedMediaType:
      description: Unsupported image type or content does not match its declared type.
    BadGateway:
      description: The remote server did not return a successful response.
    InternalServerError:
      description: Server configuration or file system error.
